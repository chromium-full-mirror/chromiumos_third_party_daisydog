description   "Reboot when daisydog fails unexpectedly"
author        "chromium-os-dev@chromium.org"

# Trigger when daisydog's main process terminates unexpectedly (e.g., abort()
# on consecutive keepalive failures, which exits via SIGABRT or via SIGSEGV
# when running as PID 1 inside minijail's PID namespace, or non-zero exit).
# Normal stops (RESULT=ok) and pre-start failures (PROCESS=pre-start, such as
# VMs without /dev/watchdog) do not match.
start on stopped daisydog RESULT=failed PROCESS=main

# Must not be OOM-killed before initiating the graceful reboot.
oom score never

task

script
  status="${EXIT_STATUS:-none}"
  signal="${EXIT_SIGNAL:-none}"
  logger -t "${UPSTART_JOB}" -p daemon.crit \
    "daisydog failed (status=${status} signal=${signal}); rebooting"
  reboot
end script
